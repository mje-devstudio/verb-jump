# PR마다 타입 검사·린트·포맷·테스트·빌드(PRD 검수 계획). E2E(Playwright)는 P1에서 main 합칠 때 추가한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04 # ubuntu-latest 이미지 전환(26)에 휘둘리지 않게 고정
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run test:coverage
      # api/를 Node ESM으로 실제 실행해 본다(Vite·Vitest가 숨기는 확장자 문제, 이슈 005)
      - run: npm run check:api
      - run: npm run build
