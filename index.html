<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>버브 점프 (가제) — 동사를 밟으면 능력이 된다</title>
    <meta
      name="description"
      content="영어 동사를 단 적을 밟으면 그 동사의 능력이 생기는 횡스크롤 플랫포머. climb를 얻으면 벽을 오르고, float를 얻으면 공중에 뜬다. 9시 전에 출근하자."
    />
    <!-- 링크 공유 미리보기(F13). 절대 주소가 필요한 곳은 배포 주소(VITE_SITE_URL)로 채운다. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="버브 점프" />
    <meta property="og:title" content="버브 점프 (가제) — 동사를 밟으면 능력이 된다" />
    <meta
      property="og:description"
      content="climb를 밟으면 벽을 오르고, float를 밟으면 공중에 뜬다. 틀린 동사는 웃긴 능력이 된다. 지각 직전 출근길, 한 판 2~3분."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="버브 점프 게임 화면: 동사 적과 담장, 코인" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
